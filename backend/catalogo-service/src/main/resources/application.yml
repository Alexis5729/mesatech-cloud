server:
  # Puerto acordado para catalogo-service.
  port: ${CATALOGO_PORT:8082}

spring:
  application:
    name: catalogo-service
  datasource:
    # En desarrollo local Catálogo utiliza una base independiente.
    # En AWS CATALOGO_DB_URL debe apuntar exclusivamente a RDS Catálogo.
    url: ${CATALOGO_DB_URL:jdbc:postgresql://localhost:5432/mesatech_catalogo}
    username: ${CATALOGO_DB_USERNAME:postgres}
    password: ${CATALOGO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
