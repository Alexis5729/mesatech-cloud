server.port=8082

spring.application.name=catalogo-service

spring.datasource.url=jdbc:postgresql://localhost:5432/mesatech_catalogo
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=mesatech_publicador
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=mesatech

spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos RabbitMQ
app.rabbitmq.exchange=catalogo.exchange
app.rabbitmq.routing-key=categoria.creada