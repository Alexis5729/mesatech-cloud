spring:
  datasource:
    # H2 permite probar la persistencia sin depender de la futura instancia EC2.
    url: jdbc:h2:mem:solicitudes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
