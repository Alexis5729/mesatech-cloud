server:
  # Puerto acordado para solicitudes-service.
  port: ${SOLICITUDES_PORT:8081}

spring:
  application:
    name: solicitudes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesatech}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
