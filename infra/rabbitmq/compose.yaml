services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: rabbitmq
    hostname: mesatech-rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
